
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donor Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🩸 Blood Donor Finder</h1>
    <p>Donate Blood, Save Lives</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#register">Register</a>
    <a href="#search">Find Donors</a>
</nav>

<section id="home" class="container">
    <h2>Welcome to Blood Donor Finder</h2>
    <p>Find blood donors easily and help save lives.</p>
    <a href="#register" class="btn">Become a Donor</a>
</section>

<section id="register" class="container">
    <h2>Register as a Donor</h2>

    <form id="donorForm">
        <input type="text" id="name" placeholder="Enter Your Name" required>
        <input type="tel" id="phone" placeholder="Enter Phone Number"
        pattern="[0-9]{10}" required>

        <select id="blood" required>
            <option value="">Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select>

        <input type="text" id="city" placeholder="Enter Your City" required>

        <button type="submit">Register Donor</button>
    </form>
    <p id="message"></p>
</section>

<section id="search" class="container">
    <h2>Find Blood Donors</h2>

    <select id="searchBlood">
        <option value="">All Blood Groups</option>
        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>O+</option>
        <option>O-</option>
        <option>AB+</option>
        <option>AB-</option>
    </select>

    <input type="text" id="searchCity" placeholder="Enter City">

    <button onclick="searchDonors()">Search Donors</button>

    <div id="donorList"></div>
</section>

<footer>
    <p>© 2026 Blood Donor Finder</p>
    <p>Every Drop Counts ❤️</p>
</footer>

<script src="script.js"></script>
</body>
</html>
